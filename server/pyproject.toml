[project]
name = "zimua-server"
version = "0.1.0"
description = "API server for Zimua Code, a web IDE for Claude Code and Codex"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
    "cryptography>=43",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.4",
    "jsonschema>=4.23",
    "pywebpush>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
# The runner reads small local files (pid, exit code) inline; a thread hop isn't worth it.
ignore = ["ASYNC240"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures hold long literal JSON lines.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["jsonschema.*", "py_vapid.*", "pywebpush.*"]
ignore_missing_imports = true
